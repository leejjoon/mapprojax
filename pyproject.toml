[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mapprojax"
version = "0.3.0"
description = "A Python implementation of cds-mapproj for WCS projections"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "jax>=0.4.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "astropy"]
# AMD GPU (ROCm 7) backend; plugin versions must match jaxlib exactly
rocm = [
    "jax==0.11.1; python_version >= '3.12'",
    "jaxlib==0.11.1; python_version >= '3.12'",
    "jax-rocm7-plugin==0.11.1; sys_platform == 'linux' and python_version >= '3.12'",
    "jax-rocm7-pjrt==0.11.1; sys_platform == 'linux' and python_version >= '3.12'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
