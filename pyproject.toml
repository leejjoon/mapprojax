[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mapprojax"
version = "0.3.0"
description = "Differentiable JAX coordinate kernel for FITS TAN/SIN WCS with SIP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "jax>=0.10.2",
    "jaxlib>=0.10.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/leejjoon/mapprojax"
Issues = "https://github.com/leejjoon/mapprojax/issues"

[project.optional-dependencies]
test = ["pytest", "astropy"]
# AMD GPU (ROCm 7) backend; plugin versions must match jaxlib exactly
rocm = [
    "jax==0.11.1; python_version >= '3.12'",
    "jaxlib==0.11.1; python_version >= '3.12'",
    "jax-rocm7-plugin==0.11.1; sys_platform == 'linux' and python_version >= '3.12'",
    "jax-rocm7-pjrt==0.11.1; sys_platform == 'linux' and python_version >= '3.12'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
